<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球星图片搜索下载</title>
    <meta name="description" content="搜索并下载免费可商用的球星图片，支持NBA球星、足球球星等">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/image-search.css">
</head>
<body>
    <nav class="main-nav">
        <a href="index.html" class="nav-link-btn">球星资料库</a>
        <a href="index.html" class="nav-link-btn">天赋分析</a>
        <a href="index.html" class="nav-link-btn">排行榜</a>
        <a href="image-search.html" class="nav-link-btn active">图片搜索</a>
        <a href="contribute.html" class="nav-link-btn">贡献图片</a>
        <button id="admin-nav-btn" class="nav-btn hidden">管理</button>
        <div class="nav-auth">
            <button id="login-btn" class="nav-link-btn">登录</button>
            <div id="user-info" class="user-info hidden">
                <span id="user-display" class="user-display"></span>
                <button id="logout-btn" class="nav-link-btn">退出</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="header">
            <h1 class="title">🏀 球星图片搜索</h1>
            <p class="subtitle">搜索免费可商用图片，一键下载到本地</p>
        </header>

        <div class="config-panel">
            <details>
                <summary>⚙️ API 配置（可选）</summary>
                <div class="config-form">
                    <p class="config-hint">配置API Key可获得更精准的搜索结果，不配置也可正常使用。</p>
                    <div class="config-item">
                        <label>Unsplash API Key</label>
                        <input type="text" id="unsplash-key" placeholder="可选，从 unsplash.com/developers 获取">
                    </div>
                    <div class="config-item">
                        <label>Pexels API Key</label>
                        <input type="text" id="pexels-key" placeholder="可选，从 pexels.com/api 获取">
                    </div>
                    <button id="save-config" class="btn-save">保存配置</button>
                </div>
            </details>
        </div>

        <div class="presets-section">
            <h3>🔥 快速搜索</h3>
            <div class="presets">
                <button class="preset-btn" data-query="stephen curry basketball">库里</button>
                <button class="preset-btn" data-query="lebron james basketball">詹姆斯</button>
                <button class="preset-btn" data-query="kevin durant basketball">杜兰特</button>
                <button class="preset-btn" data-query="giannis antetokounmpo">字母哥</button>
                <button class="preset-btn" data-query="luka doncic basketball">东契奇</button>
                <button class="preset-btn" data-query="michael jordan basketball">乔丹</button>
                <button class="preset-btn" data-query="kobe bryant basketball">科比</button>
                <button class="preset-btn" data-query="joel embiid basketball">恩比德</button>
                <button class="preset-btn" data-query="nikola jokic basketball">约基奇</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="输入球星名称或关键词...">
            <select id="source-select">
                <option value="local">本地图库</option>
                <option value="unsplash">Unsplash</option>
                <option value="pexels">Pexels</option>
            </select>
            <button id="search-btn">🔍 搜索</button>
        </div>

        <div id="status" class="status"></div>

        <div id="images-grid" class="images-grid"></div>

        <div id="actions-bar" class="actions-bar hidden">
            <span id="selected-count">已选择 0 张</span>
            <button id="download-all-btn" class="btn-primary">下载全部</button>
        </div>

        <div id="download-log" class="download-log hidden">
            <h4>📥 下载日志</h4>
            <div id="log-content"></div>
        </div>

        <footer class="footer">
            <p>💡 提示：图片来源于免费图库，可放心使用</p>
            <p class="footer-links">
                <a href="https://unsplash.com" target="_blank">Unsplash</a> ·
                <a href="https://pexels.com" target="_blank">Pexels</a>
            </p>
        </footer>
    </div>

    <!-- 登录/注册弹窗 -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-overlay" id="auth-overlay"></div>
        <div class="auth-modal-content">
            <button class="auth-close" id="auth-close">&times;</button>
            <h2 id="auth-title">登录</h2>

            <!-- 登录表单 -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="输入密码" required>
                </div>
                <button type="submit" class="btn-submit">登录</button>
                <p class="auth-switch">
                    还没有账号？<a href="#" id="switch-to-register">注册</a>
                </p>
                <p id="auth-error" class="auth-error hidden"></p>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="2-20个字符" required>
                </div>
                <div class="form-group">
                    <label>邮箱（可选）</label>
                    <input type="email" id="reg-email" placeholder="用于找回密码">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="至少4个字符" required>
                </div>
                <button type="submit" class="btn-submit">注册</button>
                <p class="auth-switch">
                    已有账号？<a href="#" id="switch-to-login">登录</a>
                </p>
                <p id="reg-error" class="auth-error hidden"></p>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/image-search.js"></script>
</body>
</html>
